name: Publish CodeQL model pack

on:
  push:
    branches:
      - master
    paths:
      - "codeql-pack.yml"
      - "models/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # publishing to GHCR

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CodeQL CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release download \
            --repo github/codeql-cli-binaries \
            --pattern 'codeql-linux64.zip' \
            --output codeql.zip
          unzip -q codeql.zip
          echo "$PWD/codeql" >> "$GITHUB_PATH"

      - name: Install pack dependencies
        run: codeql pack install

      - name: Publish pack to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: codeql pack publish
